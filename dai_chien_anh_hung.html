<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đại chiến Anh Hùng</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:28px 16px;color:#fff;font-family:Arial,sans-serif;text-align:center;background:radial-gradient(circle at top,#55251c 0,#17132e 48%,#080914 100%)}
.game{max-width:1000px;margin:auto}
h1{color:#ffd166;text-shadow:0 0 14px #ff5e00;margin:8px 0}
.subtitle{color:#d8d5ee;margin:0 0 28px}
.battle{display:flex;justify-content:center;align-items:center;gap:clamp(14px,4vw,55px);flex-wrap:wrap}
.fighter{width:min(300px,90vw);min-height:365px;padding:20px;background:rgba(20,20,39,.9);border:2px solid #f5a623;border-radius:20px;box-shadow:0 0 22px rgba(255,115,0,.2);transition:transform .2s}
.fighter h2{color:#ffd166;margin-top:0}
.fighter img{width:205px;height:205px;object-fit:cover;border-radius:16px;border:3px solid #fff}
.dragon{height:205px;display:grid;place-items:center;font-size:145px;filter:drop-shadow(0 0 16px #ff4b24);animation:fly 1.8s ease-in-out infinite alternate}
.vs{color:#ff4545;font-size:48px;font-weight:900;text-shadow:0 0 15px red}
.health{height:18px;overflow:hidden;border-radius:20px;background:#555}
.health div{height:100%;width:100%;transition:width .35s}
.hero-bar{background:linear-gradient(90deg,#19d66b,#b7ff54)}
.dragon-bar{background:linear-gradient(90deg,#ff9b22,#ed2424)}
.controls{margin:28px auto 12px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
button{border:0;border-radius:10px;padding:14px 18px;background:#ffb52e;color:#241300;font-weight:800;cursor:pointer;transition:transform .15s,filter .15s}
button:hover{transform:translateY(-3px) scale(1.03);filter:brightness(1.15)}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}
.reset{background:#c9c7df}
.result{min-height:30px;font-size:20px;font-weight:bold;color:#ffe08a}
.hint{color:#bdbbd0;font-size:14px}
.hit{animation:shake .32s}
.attack{animation:lunge .35s}
@keyframes fly{from{transform:translateY(4px) rotate(-5deg)}to{transform:translateY(-18px) rotate(5deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-13px)}75%{transform:translateX(13px)}}
@keyframes lunge{50%{transform:scale(1.08) translateY(-8px)}}
@media(max-width:650px){.vs{font-size:34px}.fighter{min-height:340px}}
</style>
</head>
<body>
<main class="game">
<h1>⚔️ ĐẠI CHIẾN ANH HÙNG ⚔️</h1>

}
function animate(id,cls){const el=$(id);el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);}
function finishIfNeeded(){
 if(dragonHealth<=0){dragonHealth=0;gameOver=true;$("result").textContent="🏆 CHIẾN THẮNG! Rồng Già đã bị đánh bại!";}
 else if(heroHealth<=0){heroHealth=0;gameOver=true;$("result").textContent="💀 THẤT BẠI! Anh hùng đã bị Rồng đánh bại!";}
 update();return gameOver;
}
function dragonAttack(){
 const damage=Math.floor(Math.random()*31)+30;
 heroHealth=Math.max(0,heroHealth-damage);animate("hero","hit");
 $("result").textContent=`🐉 Rồng phản công, gây ${damage} sát thương!`;finishIfNeeded();
}
function heroAction(damage,message){
 if(gameOver)return;
 dragonHealth=Math.max(0,dragonHealth-damage);animate("dragon","hit");
 $("result").textContent=`${message} Gây ${damage} sát thương!`;
 if(!finishIfNeeded()){setTimeout(()=>{if(!gameOver){dragonAttack();update();}},350);}
 update();
}
$("attackBtn").addEventListener("click",()=>{animate("hero","attack");heroAction(Math.floor(Math.random()*31)+50,"⚔️ Anh hùng tấn công!");});
$("specialBtn").addEventListener("click",()=>{animate("hero","attack");heroAction(150,"🔥 TUYỆT CHIÊU!");});
$("healBtn").addEventListener("click",()=>{
 if(gameOver)return;const before=heroHealth;heroHealth=Math.min(MAX_HERO_HP,heroHealth+100);
 $("result").textContent=`❤️ Anh hùng hồi phục ${heroHealth-before} máu!`;update();
 setTimeout(()=>{if(!gameOver){dragonAttack();update();}},350);
});
$("resetBtn").addEventListener("click",()=>{heroHealth=MAX_HERO_HP;dragonHealth=MAX_DRAGON_HP;gameOver=false;$("result").textContent="Trận chiến bắt đầu lại! Hãy chọn hành động.";update();});
update();
</script>
</body>
</html>
